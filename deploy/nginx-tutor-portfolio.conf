# /etc/nginx/sites-available/tutor-portfolio
#
# Serves the generated static site (site/ directory contents) from
# /var/www/tutor-portfolio. Replace tutors.example.com with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name tutors.example.com;

    root /var/www/tutor-portfolio;
    index index.html;

    # site/tutors/<key>/index.html is served automatically for /tutors/<key>/
    # because nginx looks for index.html inside a matching directory.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache the static assets a bit; HTML stays revalidated so republishing
    # (re-running sync + build) shows up immediately.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # --- Login / edit-your-own-profile backend (server/index.js) ---
    # Proxy these to the Node process (e.g. run with pm2/systemd on
    # 127.0.0.1:3000 — see server/README.md). Everything else above keeps
    # being served as plain static files directly by nginx.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /edit {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/tutor-portfolio.access.log;
    error_log  /var/log/nginx/tutor-portfolio.error.log;
}
