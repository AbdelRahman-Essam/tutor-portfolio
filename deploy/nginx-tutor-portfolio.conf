# /etc/nginx/sites-available/tutor-portfolio
#
# Serves the generated static site (site/ directory contents) from
# /var/www/tutor-portfolio. Replace tutors.example.com with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name tutors.example.com;

    root /var/www/tutor-portfolio;
    index index.html;

    # site/tutors/<key>/index.html is served automatically for /tutors/<key>/
    # because nginx looks for index.html inside a matching directory.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache the static assets a bit; HTML stays revalidated so republishing
    # (re-running sync + build) shows up immediately.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/tutor-portfolio.access.log;
    error_log  /var/log/nginx/tutor-portfolio.error.log;
}
